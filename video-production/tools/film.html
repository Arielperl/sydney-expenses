<!doctype html>
<!--
  Sydney explainer animatic — deterministic, time-driven film document.
  window.renderFrame(t) draws the frame at t seconds; tools/render.mjs captures
  every frame with headless Chrome. Query: ?fmt=16x9|9x16 &cut=main|15|06
  &chip=1 (previs labels) &still=<t> (render one frame for inspection).
  Live-action shots are previs illustrations (placeholders for AI video);
  typography, UI inserts and the end card are final-quality motion graphics.
-->
<html lang="he">
<head>
<meta charset="utf-8" />
<title>Sydney Animatic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet" />
<style>
  :root {
    --mint: #41d7b2;
    --deep: #0b2a22;
    --deeper: #071a15;
    --brand-50: #eff8f5;
    --brand-100: #d7efe7;
    --ease: cubic-bezier(0.25, 1, 0.5, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  body { font-family: "IBM Plex Sans Hebrew", "IBM Plex Sans", sans-serif; color: #fff; }
  #stage { position: relative; overflow: hidden; background: #000; }
  .layer { position: absolute; inset: 0; }
  .layer > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #grain { position: absolute; inset: -64px; pointer-events: none; mix-blend-mode: overlay; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.38) 100%); }
  bdi { unicode-bidi: isolate; }
  .num { font-family: "IBM Plex Sans", sans-serif; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* ---------- Text overlays ---------- */
  .t { position: absolute; direction: rtl; text-align: right; font-weight: 600; line-height: 1.2; letter-spacing: 0; will-change: transform, opacity; }
  .t .line { display: block; }
  .t.headline { font-size: var(--h); }
  .t.sub { font-weight: 400; font-size: var(--s); color: rgba(255,255,255,.72); }
  .t.tag { font-family: "IBM Plex Sans", sans-serif; font-weight: 500; font-size: var(--tag); color: var(--mint); letter-spacing: .04em; font-variant-numeric: tabular-nums; direction: ltr; }
  .t.center { text-align: center; }
  .scrim { position: absolute; pointer-events: none; background: radial-gradient(closest-side, rgba(0,0,0,.35), transparent); }

  /* ---------- Brand lockup ---------- */
  .lockup { display: inline-flex; flex-direction: row; align-items: center; gap: calc(var(--lk) * .45); direction: rtl; }
  .lockup .tile { width: calc(var(--lk) * 2.2); height: calc(var(--lk) * 2.2); border-radius: calc(var(--lk) * .55); background: var(--brand-50); box-shadow: inset 0 0 0 1px var(--brand-100); display: grid; place-items: center; }
  .lockup .tile img { width: 64%; height: 64%; }
  .lockup .name { display: flex; flex-direction: column; align-items: flex-start; font-weight: 600; font-size: var(--lk); line-height: 1.15; }
  .lockup .name small { font-family: "IBM Plex Sans", sans-serif; font-weight: 500; font-size: calc(var(--lk) * .4); letter-spacing: .16em; color: rgba(255,255,255,.6); margin-top: calc(var(--lk) * .15); direction: rtl; }

  /* ---------- Motion-graphics world ---------- */
  .mg-bg { position: absolute; inset: 0; background: radial-gradient(120% 90% at 85% 0%, #14463a 0%, var(--deep) 55%, var(--deeper) 100%); }
  .mg-bg .wave { position: absolute; inset: -4%; background: url('../assets/source/sydney-hero-clean.png') left center / cover no-repeat; opacity: .18; filter: blur(6px); }
  .panel { position: absolute; direction: rtl; border-radius: 18px; background: rgba(8,36,31,.72); border: 1px solid rgba(255,255,255,.09); box-shadow: 0 40px 80px -30px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.25); backdrop-filter: blur(10px); overflow: hidden; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 28px 34px 20px; border-bottom: 1px solid rgba(255,255,255,.07); }
  .panel-head h3 { font-size: 30px; font-weight: 600; }
  .panel-head .muted { color: rgba(255,255,255,.55); font-size: 20px; font-weight: 400; margin-inline-start: 14px; }
  .pill { font-size: 17px; color: rgba(255,255,255,.62); border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 5px 14px; white-space: nowrap; }
  .rows { position: relative; }
  .row { position: absolute; inset-inline: 0; height: 104px; display: flex; align-items: center; gap: 20px; padding: 0 34px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .row .who { flex: 1; min-width: 0; }
  .row .who b { display: block; font-size: 25px; font-weight: 500; }
  .row .who span { display: block; font-size: 18px; color: rgba(255,255,255,.5); margin-top: 2px; }
  .badge { font-size: 16px; font-weight: 500; border-radius: 8px; padding: 5px 11px; white-space: nowrap; }
  .b-ok { background: rgba(47,158,91,.18); color: #7ddc9f; }
  .b-wait { background: rgba(242,181,68,.14); color: #f2c66a; }
  .b-doc { background: rgba(65,215,178,.12); color: #7fe3c9; }
  .b-src { background: rgba(255,255,255,.07); color: rgba(255,255,255,.75); font-family: "IBM Plex Sans", sans-serif; }
  .amount { font-size: 27px; font-weight: 500; min-width: 150px; text-align: left; }
  .hl { position: absolute; inset: 6px 10px; border-radius: 12px; border: 1px solid var(--mint); background: rgba(65,215,178,.14); pointer-events: none; }

  .dash .fig-label { font-size: 21px; color: rgba(255,255,255,.62); }
  .dash .fig { font-size: 76px; font-weight: 500; line-height: 1.1; margin-top: 6px; }
  .dash .fig-note { font-size: 18px; color: rgba(255,255,255,.5); margin-top: 8px; }
  .dash dl { display: grid; }
  .dash dl div { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-top: 1px solid rgba(255,255,255,.07); font-size: 22px; position: relative; }
  .dash dt { color: rgba(255,255,255,.7); }
  .dash dd { font-weight: 500; }

  .att .count { display: flex; align-items: baseline; gap: 16px; }
  .att .count strong { font-family: "IBM Plex Sans", sans-serif; font-size: 72px; font-weight: 500; line-height: 1; position: relative; display: inline-block; min-width: 48px; height: 80px; overflow: hidden; }
  .att .count strong span { position: absolute; inset-inline-start: 0; top: 0; }
  .att .count em { font-style: normal; font-size: 22px; color: rgba(255,255,255,.62); }
  .card { position: absolute; inset-inline: 30px; height: 132px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 20px; padding: 0 24px; }
  .card .who { flex: 1; }
  .card .who b { display: block; font-size: 24px; font-weight: 500; margin-top: 8px; }
  .card .who span { font-size: 17px; color: rgba(255,255,255,.5); }
  .btn { font-size: 19px; font-weight: 600; border-radius: 10px; padding: 12px 18px; border: 1px solid rgba(255,255,255,.2); color: #fff; white-space: nowrap; }
  .btn.primary { background: var(--mint); color: #062b23; border-color: transparent; }
  .done { position: absolute; inset: 0; border-radius: 14px; background: rgba(8,36,31,.92); border: 1px solid var(--mint); display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--mint); font-size: 26px; font-weight: 600; }
  .cursor { position: absolute; width: 30px; height: 44px; pointer-events: none; }

  .cta { display: inline-flex; align-items: center; gap: 14px; background: var(--mint); color: #062b23; font-weight: 600; border-radius: 12px; direction: rtl; }
  .url { font-family: "IBM Plex Sans", sans-serif; font-weight: 500; color: rgba(255,255,255,.8); direction: ltr; unicode-bidi: isolate; }

  #chip { position: absolute; font-family: "IBM Plex Mono", monospace; font-size: 17px; letter-spacing: .04em; color: rgba(255,255,255,.72); background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.18); border-radius: 6px; padding: 6px 10px; direction: ltr; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <div id="pic" class="layer"></div>
  <div id="pic2" class="layer"></div>
  <div id="grainwrap" class="layer"><canvas id="grain"></canvas></div>
  <div id="vignette"></div>
  <div id="texts" class="layer"></div>
  <div id="chip"></div>
</div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const FMT = Q.get('fmt') === '9x16' ? '9x16' : '16x9';
const CUT = Q.get('cut') || 'main';
const CHIP = Q.get('chip') !== '0';
const V = FMT === '9x16';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
document.documentElement.style.setProperty('--h', (V ? 76 : 64) + 'px');
document.documentElement.style.setProperty('--s', (V ? 34 : 30) + 'px');
document.documentElement.style.setProperty('--tag', (V ? 36 : 30) + 'px');

/* ---------------- math helpers ---------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const easeOut = x => 1 - Math.pow(1 - clamp(x), 4);          // ease-out-quart
const easeInOut = x => { x = clamp(x); return x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2; };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const money = v => '₪' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

/* ---------------- grain ---------------- */
const grainC = document.getElementById('grain');
grainC.width = W + 128; grainC.height = H + 128;
const gctx = grainC.getContext('2d');
const gtiles = [];
function makeGrain() {
  for (let k = 0; k < 4; k++) {
    const img = gctx.createImageData(256, 256); const r = rng(97 + k * 13);
    for (let i = 0; i < img.data.length; i += 4) { const v = 128 + (r() - .5) * 110; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    const c = document.createElement('canvas'); c.width = c.height = 256; c.getContext('2d').putImageData(img, 0, 0); gtiles.push(c);
  }
}
function drawGrain(frame, strength) {
  const tile = gtiles[frame % 4];
  gctx.clearRect(0, 0, grainC.width, grainC.height);
  gctx.fillStyle = gctx.createPattern(tile, 'repeat'); gctx.fillRect(0, 0, grainC.width, grainC.height);
  grainC.style.opacity = strength;
  grainC.style.transform = `translate(${(frame * 37) % 64}px, ${(frame * 53) % 64}px)`;
}

/* =========================================================================
   PREVIS ILLUSTRATIONS (1920x1080 design space). Each returns SVG markup.
   ========================================================================= */
const SKIN = '#c89a78', SKIN_D = '#a87a5b', HAIR = '#3a2519', CHAR = '#3b3f40', OAT = '#d9ccb4';

function svgWrap(inner, crop, extra = '') {
  // crop = centre x (design space) used for the vertical 9:16 window
  const vb = V ? `${crop - 303.75} 0 607.5 1080` : '0 0 1920 1080';
  return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="b2"><feGaussianBlur stdDeviation="2"/></filter>
      <filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="b14"><feGaussianBlur stdDeviation="14"/></filter>
      <filter id="b30"><feGaussianBlur stdDeviation="30"/></filter>
      <filter id="b60"><feGaussianBlur stdDeviation="60"/></filter>
      <radialGradient id="mintGlow"><stop offset="0" stop-color="#8ff0d6" stop-opacity="1"/><stop offset=".35" stop-color="#41d7b2" stop-opacity=".85"/><stop offset="1" stop-color="#41d7b2" stop-opacity="0"/></radialGradient>
      <radialGradient id="amber"><stop offset="0" stop-color="#ffd79a" stop-opacity=".95"/><stop offset=".5" stop-color="#e9a24a" stop-opacity=".45"/><stop offset="1" stop-color="#e9a24a" stop-opacity="0"/></radialGradient>
      <radialGradient id="amberSoft"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".7"/><stop offset="1" stop-color="#e9a24a" stop-opacity="0"/></radialGradient>
      <radialGradient id="cold"><stop offset="0" stop-color="#d6e6ff" stop-opacity=".95"/><stop offset=".6" stop-color="#9fbde8" stop-opacity=".35"/><stop offset="1" stop-color="#9fbde8" stop-opacity="0"/></radialGradient>
      <linearGradient id="oak" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d7b98f"/><stop offset="1" stop-color="#b8956a"/></linearGradient>
      <linearGradient id="plaster" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4efe6"/><stop offset="1" stop-color="#e6ddcf"/></linearGradient>
      ${extra}
    </defs>${inner}</svg>`;
}

/* ---- the terminal macro (S01, S02, S04) ---- */
function terminalScene({ night = false, lampOn = 0, glow = 0, card = null, phone = null, receipt = false, slide = 0 }) {
  const dx = -slide;          // slider move right->left shifts the scene
  let s = '';
  if (!night) {
    s += `<rect width="1920" height="1080" fill="url(#plaster)"/>`;
    const r = rng(5);
    for (let i = 0; i < 16; i++) s += `<circle cx="${(r() * 2200 - 140 + dx * .4).toFixed(0)}" cy="${(r() * 700).toFixed(0)}" r="${(60 + r() * 150).toFixed(0)}" fill="${['#fff8ec', '#e9dcc6', '#f7f0e2', '#dcd2bf'][i % 4]}" opacity=".55" filter="url(#b30)"/>`;
    s += `<rect x="1580" y="0" width="340" height="1080" fill="#fffaf0" opacity=".35" filter="url(#b60)"/>`;
  } else {
    s += `<rect width="1920" height="1080" fill="#07100e"/>`;
    s += `<rect x="1400" y="0" width="520" height="1080" fill="#3fa39a" opacity=".07" filter="url(#b60)"/>`;
  }
  // counter
  s += `<g transform="translate(${dx},0)">`;
  s += `<rect x="-200" y="820" width="2400" height="300" fill="${night ? '#2b2118' : 'url(#oak)'}"/>`;
  const r2 = rng(11);
  for (let i = 0; i < 14; i++) { const y = 840 + r2() * 230; s += `<path d="M-200 ${y} C 400 ${y + r2() * 14 - 7}, 1200 ${y + r2() * 18 - 9}, 2200 ${y + r2() * 10 - 5}" stroke="${night ? '#1c150f' : '#a9855c'}" stroke-width="${1 + r2() * 2}" fill="none" opacity=".5"/>`; }
  s += `<rect x="-200" y="812" width="2400" height="14" fill="${night ? '#3a2d20' : '#e3c9a3'}" filter="url(#b6)"/>`;
  // terminal body (angled face)
  s += `<g>
    <path d="M330 1000 L360 300 Q365 230 440 228 L900 222 Q975 224 978 300 L1000 1000 Z" fill="${night ? '#0b0d0d' : '#17191a'}"/>
    <path d="M360 300 Q365 230 440 228 L900 222 Q975 224 978 300" stroke="${night ? '#2a3a38' : '#4c5254'}" stroke-width="5" fill="none" opacity=".8"/>
    <rect x="420" y="276" width="500" height="250" rx="26" fill="${night ? '#050707' : '#0c0f10'}" stroke="${night ? '#1a2322' : '#2c3335'}" stroke-width="3"/>
    <rect x="440" y="292" width="460" height="40" rx="14" fill="#fff" opacity="${night ? .03 : .07}"/>
    <path d="M400 600 L960 596" stroke="#fff" stroke-opacity="${night ? .03 : .06}" stroke-width="2"/>
  </g>`;
  if (glow > 0) {
    s += `<ellipse cx="670" cy="400" rx="${230 + glow * 40}" ry="${120 + glow * 25}" fill="url(#mintGlow)" opacity="${glow}"/>`;
    s += `<ellipse cx="670" cy="400" rx="520" ry="330" fill="#41d7b2" opacity="${glow * .16}" filter="url(#b60)"/>`;
  }
  if (receipt) s += `<path d="M1060 900 C 1180 860, 1300 880, 1360 830 C 1380 815, 1395 840, 1370 860 C 1300 915, 1180 930, 1070 930 Z" fill="#e9e6df" opacity="${night ? .55 : .9}"/>`;
  s += `</g>`;
  if (card) {       // card + hand from the right
    const { x, y, rot } = card;
    s += `<g transform="translate(${x},${y}) rotate(${rot})">
      <path d="M180 60 C 420 20, 700 60, 900 140 L 900 420 C 700 380, 420 360, 230 300 Z" fill="#8e8f93" opacity=".95"/>
      <path d="M170 70 C 250 40, 360 40, 420 70 L 440 250 C 380 300, 260 300, 200 270 Z" fill="${SKIN}"/>
      <path d="M150 150 C 120 120, 60 110, 40 150 C 30 180, 80 200, 150 210 Z" fill="${SKIN_D}"/>
      <rect x="-40" y="0" width="330" height="208" rx="20" fill="#3d4043"/>
      <rect x="-40" y="0" width="330" height="208" rx="20" fill="none" stroke="#5c6064" stroke-width="3"/>
      <rect x="-20" y="16" width="120" height="12" rx="6" fill="#fff" opacity=".06"/>
      <path d="M220 70 C 300 60, 360 80, 380 120 C 390 150, 360 170, 300 165 Z" fill="${SKIN}"/>
    </g>`;
  }
  if (phone) {
    const { x, y, rot } = phone;
    s += `<g transform="translate(${x},${y}) rotate(${rot})">
      <path d="M260 40 C 480 10, 760 40, 960 120 L 960 420 C 760 380, 480 360, 300 300 Z" fill="#8aa596" opacity=".95"/>
      <path d="M230 50 C 300 20, 400 30, 450 60 L 470 240 C 400 290, 300 290, 250 260 Z" fill="#e2b99a"/>
      <rect x="-60" y="-30" width="320" height="170" rx="30" fill="#0c0d0f"/>
      <rect x="-66" y="-36" width="332" height="182" rx="34" fill="none" stroke="#cfd6d6" stroke-opacity=".5" stroke-width="5"/>
      <path d="M200 20 C 270 10, 330 30, 345 70 C 350 100, 320 110, 270 100 Z" fill="#e2b99a"/>
    </g>`;
  }
  if (night && lampOn > 0) {
    s += `<ellipse cx="420" cy="360" rx="1100" ry="760" fill="url(#amber)" opacity="${lampOn * .85}" style="mix-blend-mode:screen"/>`;
  }
  return s;
}

/* ---- the seated owner, master wide (S05, S13, S16) ---- */
function ownerSeated({ x = 1230, pose = 'hunch', mugUp = 0, slip = false, headTurn = 0, stand = 0 }) {
  const hunch = pose === 'hunch';
  const hx = x - (hunch ? 42 : 8) + headTurn * -10, hy = (hunch ? 452 : 420) - stand * 60;
  const sy = hunch ? 505 : 488;
  let s = `<g>`;
  // legs to the stool footrest
  s += `<path d="M${x - 20} ${640 - stand * 60} L ${x - 70} ${800} L ${x - 40} ${806} L ${x + 20} ${650 - stand * 60} Z" fill="#141617"/>`;
  s += `<path d="M${x + 10} ${640 - stand * 60} L ${x - 20} ${810} L ${x + 10} ${814} L ${x + 45} ${650 - stand * 60} Z" fill="#101213"/>`;
  s += `<ellipse cx="${x - 55}" cy="812" rx="26" ry="9" fill="#8d8f93"/><ellipse cx="${x - 5}" cy="818" rx="26" ry="9" fill="#8d8f93"/>`;
  // torso (charcoal top) + cardigan
  s += `<path d="M${x - 55} ${sy} Q ${x - 70} ${580 - stand * 60} ${x - 50} ${648 - stand * 60} L ${x + 60} ${648 - stand * 60} Q ${x + 70} ${560} ${x + 40} ${sy - 6} Q ${x - 10} ${sy - 30} ${x - 55} ${sy} Z" fill="${CHAR}"/>`;
  s += `<path d="M${x + 44} ${sy - 4} Q ${x + 84} ${570} ${x + 66} ${652 - stand * 60} L ${x + 12} ${652 - stand * 60} Q ${x + 30} ${580} ${x + 16} ${sy - 12} Z" fill="${OAT}"/>`;
  s += `<path d="M${x - 58} ${sy + (slip ? 20 : 0)} Q ${x - 84} ${580} ${x - 60} ${652 - stand * 60} L ${x - 30} ${652 - stand * 60} Q ${x - 48} ${580} ${x - 30} ${sy + (slip ? 30 : 8)} Z" fill="${OAT}"/>`;
  // arm reaching to the laptop / holding the mug
  if (mugUp > 0) {
    const my = lerp(582, 520, mugUp);
    s += `<path d="M${x - 40} ${sy + 20} Q ${x - 110} ${my + 40} ${x - 115} ${my + 8}" stroke="${OAT}" stroke-width="26" stroke-linecap="round" fill="none"/>`;
    s += `<rect x="${x - 146}" y="${my - 30}" width="40" height="46" rx="8" fill="#ede7dc"/>`;
    s += `<circle cx="${x - 118}" cy="${my + 4}" r="13" fill="${SKIN}"/>`;
  } else if (stand < .01) {
    s += `<path d="M${x - 40} ${sy + 20} Q ${x - 120} ${560} ${x - 150} ${582}" stroke="${OAT}" stroke-width="26" stroke-linecap="round" fill="none"/>`;
    s += `<circle cx="${x - 158}" cy="${584}" r="13" fill="${SKIN}"/>`;
  }
  // neck, head, bun, strands, hoop
  s += `<rect x="${hx - 9}" y="${hy + 24}" width="22" height="34" fill="${SKIN_D}"/>`;
  s += `<ellipse cx="${hx}" cy="${hy}" rx="30" ry="37" fill="${SKIN}"/>`;
  s += `<path d="M${hx - 30} ${hy - 6} Q ${hx - 26} ${hy - 44} ${hx + 6} ${hy - 40} Q ${hx + 36} ${hy - 36} ${hx + 32} ${hy + 8} Q ${hx + 20} ${hy + 30} ${hx + 8} ${hy + 30} L ${hx + 4} ${hy - 12} Q ${hx - 14} ${hy - 22} ${hx - 30} ${hy - 6} Z" fill="${HAIR}"/>`;
  s += `<circle cx="${hx + 34}" cy="${hy + 22}" r="16" fill="${HAIR}"/>`;
  s += `<path d="M${hx - 24} ${hy - 16} Q ${hx - 30} ${hy + 10} ${hx - 22} ${hy + 30}" stroke="${HAIR}" stroke-width="3" fill="none"/>`;
  if (hunch) s += `<path d="M${hx - 12} ${hy - 30} Q ${hx - 36} ${hy} ${hx - 26} ${hy + 40}" stroke="${HAIR}" stroke-width="3" fill="none"/><path d="M${hx + 2} ${hy - 34} Q ${hx - 10} ${hy - 10} ${hx - 16} ${hy + 38}" stroke="${HAIR}" stroke-width="2.5" fill="none"/>`;
  s += `<circle cx="${hx + 4}" cy="${hy + 16}" r="4" fill="none" stroke="#d8b25a" stroke-width="2"/>`;
  s += `</g>`;
  return s;
}

function masterWide({ variant = 'n1', t = 0, lampOn = 1, owner = {}, walk = 0, shake = 0 }) {
  const n1 = variant === 'n1';
  let s = '';
  // wall + floor
  s += `<rect width="1920" height="1080" fill="${n1 ? '#121918' : '#0f1c19'}"/>`;
  s += `<rect y="760" width="1920" height="320" fill="${n1 ? '#0c1110' : '#0b1512'}"/>`;
  // door (frame-left)

  s += `<path d="M360 545 L 372 492 L 428 492 L 440 545 Z" fill="#b5613c"/>`;

  s += `<path d="M880 545 L 886 510 L 926 508 L 932 545 Z" fill="#17191a"/>`;

  </g>`;
  s += `</g>`;
  return s;
}

/* ---- S06 overhead ---- */
function overhead(t) {
  const drift = { x: Math.sin(t * 1.6) * 8, y: Math.cos(t * 1.2) * 6 };
  let s = `<g transform="translate(${drift.x},${drift.y})"><rect x="-40" y="-40" width="2000" height="1160" fill="#5a4330"/>`;
  for (let i = 0; i < 7; i++) s += `<line x1="-40" y1="${i * 170}" x2="2000" y2="${i * 170 + 10}" stroke="#3f2f22" stroke-width="3"/>`;
  s += `<ellipse cx="900" cy="480" rx="720" ry="520" fill="url(#amber)" opacity=".75" style="mix-blend-mode:screen"/>`;
  // calculator (upper-left)
  s += `<g transform="rotate(-8 330 250)"><rect x="200" y="120" width="260" height="340" rx="18" fill="#8c918f"/><rect x="226" y="146" width="208" height="60" rx="6" fill="#6d7371"/>${[0, 1, 2, 3].map(r => [0, 1, 2, 3].map(c => `<rect x="${230 + c * 52}" y="${226 + r * 56}" width="40" height="42" rx="6" fill="#c5c9c7"/>`).join('')).join('')}</g>`;
  // receipts (upper-right)
  const rr = rng(21);
  for (let i = 0; i < 6; i++) { const x = 1250 + rr() * 380, y = 90 + rr() * 260, a = rr() * 60 - 30; s += `<g transform="rotate(${a} ${x} ${y})"><rect x="${x}" y="${y}" width="120" height="300" rx="4" fill="#efece6"/>${[0, 1, 2, 3, 4, 5, 6].map(k => `<line x1="${x + 16}" y1="${y + 30 + k * 34}" x2="${x + 104 - (k % 3) * 18}" y2="${y + 30 + k * 34}" stroke="#b8b6b0" stroke-width="5"/>`).join('')}</g>`; }
  // phone (lower-left) with a cold unreadable glow
  s += `<g transform="rotate(12 360 820)"><rect x="250" y="640" width="210" height="400" rx="34" fill="#0d0e10"/><rect x="266" y="660" width="178" height="360" rx="22" fill="#a9c6ea" opacity=".8"/>${[0, 1, 2, 3, 4, 5].map(k => `<rect x="286" y="${690 + ((k * 60 + t * 90) % 330)}" width="138" height="34" rx="8" fill="#e3eefc" opacity=".35" filter="url(#b6)"/>`).join('')}</g>`;
  s += `<ellipse cx="360" cy="840" rx="260" ry="300" fill="url(#cold)" opacity=".4" style="mix-blend-mode:screen"/>`;
  // notebook (centre)
  s += `<rect x="700" y="230" width="560" height="700" rx="10" fill="#f3efe4"/><rect x="700" y="230" width="560" height="700" rx="10" fill="none" stroke="#b39468" stroke-width="10"/>`;
  for (let k = 0; k < 16; k++) s += `<circle cx="${740 + k * 32}" cy="230" r="9" fill="none" stroke="#6a6a6a" stroke-width="5"/>`;
  const rw = rng(33);
  for (let k = 0; k < 11; k++) {
    const y = 300 + k * 52; let d = `M${1190} ${y}`; for (let j = 0; j < 9; j++) d += ` l ${-26 - rw() * 10} ${(rw() - .5) * 14}`;
    s += `<path d="${d}" stroke="#74726c" stroke-width="4" fill="none" opacity=".75"/>`;

  }
  // the new figure being written, then struck through
  const wr = prog(t, .35, .95), st = prog(t, 1.1, 1.35);
  const ny = 300 + 11 * 52;
  let d = `M1190 ${ny}`; const rn = rng(44); for (let j = 0; j < Math.floor(9 * wr); j++) d += ` l ${-28} ${(rn() - .5) * 14}`;
  s += `<path d="${d}" stroke="#4a4844" stroke-width="5" fill="none"/>`;
  if (st > 0) s += `<line x1="1205" y1="${ny - 2}" x2="${1205 - 300 * st}" y2="${ny - 6}" stroke="#2f2d2a" stroke-width="7" stroke-linecap="round"/>`;
  // right hand with pencil
  const px = t < 1.1 ? 1190 - 250 * wr : 1205 - 300 * st, py = ny - 4;
  s += `<g transform="translate(${px},${py})">
      <line x1="0" y1="0" x2="190" y2="170" stroke="#e0b64c" stroke-width="16" stroke-linecap="round"/><path d="M0 0 L 14 26 L 26 12 Z" fill="#333"/>

  const th = Math.sin(t * 5) * 14;

  s += `</g>`;
  return s;
}

/* ---- S07 / S15 face close-up ---- */

    Q ${cx - 230} ${cy + 72} ${cx - 222} ${cy + 58} L ${cx - 190} ${cy + 8} Q ${cx - 172} ${cy - 40} ${cx - 168} ${cy - 80} Q ${cx - 150} ${cy - 210} ${cx + 40} ${cy - 260} Z`;

    `<path d="M${cx - 134} ${ey} q 24 -14 48 0 q -24 12 -48 0 Z" fill="#f2ece6"/><circle cx="${cx - 124 - (n1 ? 0 : 2)}" cy="${ey + 1 + lookDown * 3}" r="7" fill="#2a1d16"/>`;

  s += `<circle cx="${cx + 250}" cy="${cy + 140}" r="84" fill="${HAIR}"/>`;

  // ear + hoop
  s += `<ellipse cx="${cx + 70}" cy="${cy + 10}" rx="24" ry="42" fill="${SKIN_D}"/><circle cx="${cx + 70}" cy="${cy + 64}" r="12" fill="none" stroke="#d8b25a" stroke-width="5"/>`;

  } else {

}

/* ---- S08 over the shoulder ---- */
function overShoulder(t) {
  const lean = easeInOut(prog(t, .3, 1.4));
  const drift = { x: Math.sin(t * 1.7) * 7 + lean * 30, y: Math.cos(t * 1.3) * 5 + lean * -10 };
  let s = `<rect width="1920" height="1080" fill="#070b0b"/>`;
  s += `<g transform="translate(${drift.x},${drift.y})">`;
  s += `<g filter="url(#b30)"><rect x="420" y="330" width="560" height="360" rx="20" fill="#bcd3f2"/>${[0, 1, 2, 3].map(k => `<rect x="${460 + (k % 2) * 250}" y="${370 + Math.floor(k / 2) * 150}" width="220" height="110" rx="10" fill="#eef4ff" opacity=".6"/>`).join('')}</g>`;
  s += `<ellipse cx="700" cy="520" rx="620" ry="420" fill="url(#cold)" opacity=".45" style="mix-blend-mode:screen"/>`;
  s += `<g filter="url(#b14)"><rect x="120" y="820" width="700" height="300" fill="#3a2d20"/><path d="M200 860 q 40 -30 90 -4 M 380 880 q 40 -30 90 -4 M 560 850 q 40 -30 90 -4" stroke="#e8e4dc" stroke-width="10" fill="none" opacity=".6"/></g>`;
  // back of head + shoulder (right)
  const hx = 1380 + lean * 40, hy = 440 - lean * 60;
  s += `<path d="M1040 1080 Q 1060 820 1240 760 Q 1420 720 1640 760 Q 1860 820 1920 900 L 1920 1080 Z" fill="${OAT}"/>`;
  s += `<path d="M${1040 + 20} 1080 Q 1100 900 1200 ${860 + (1 - lean) * 20}" stroke="#bfae8f" stroke-width="6" fill="none" opacity=".6"/>`;
  s += `<rect x="${hx - 70}" y="${hy + 140}" width="150" height="220" fill="#8a6750"/>`;
  s += `<ellipse cx="${hx}" cy="${hy}" rx="170" ry="200" fill="${HAIR}"/>`;
  s += `<circle cx="${hx + 20}" cy="${hy + 150}" r="80" fill="${HAIR}"/>`;
  // arms up behind the neck as she leans back
  if (lean > .05) {
    s += `<path d="M${1200} ${1080} Q ${hx - 260} ${lerp(900, hy + 60, lean)} ${hx - 60} ${lerp(1000, hy + 150, lean)}" stroke="${OAT}" stroke-width="80" stroke-linecap="round" fill="none"/>`;
    s += `<path d="M${1900} ${1080} Q ${hx + 300} ${lerp(900, hy + 40, lean)} ${hx + 90} ${lerp(1000, hy + 150, lean)}" stroke="${OAT}" stroke-width="80" stroke-linecap="round" fill="none"/>`;
  }
  s += `<path d="M${hx - 150} ${hy - 110} Q ${hx} ${hy - 230} ${hx + 150} ${hy - 110}" stroke="#e9a24a" stroke-width="8" fill="none" opacity=".45" filter="url(#b6)"/>`;
  s += `</g>`;
  return s;
}

/* ---------------- text animation ---------------- */
function textAnim(t, start, end) {
  if (start == null || t < start) return { o: 0, y: 12 };
  const i = easeOut(prog(t, start, start + .4));
  let o = i, y = (1 - i) * 12;
  if (t > end) o *= 1 - clamp((t - end) / .3);
  return { o, y };
}

const cut = CUTS[CUT];

const pic = document.getElementById('pic'), pic2 = document.getElementById('pic2');
const texts = document.getElementById('texts'), chip = document.getElementById('chip');

function drawShot(el, seg, t) {
  const [id, a, b, src = 0, opts] = seg;
  const shot = SHOTS[id]; const local = t - a + src;
  if (shot.kind === 'svg') el.innerHTML = svgWrap(shot.draw(local), shot.crop);
  else el.innerHTML = shot.draw(local, b - a, opts);
  return shot;
}

function renderTexts(t) {
  let html = '';
  for (const e of cut.texts) {
    if (t < e.a - .01) continue;
    if (e.hardOut != null && t >= e.hardOut) continue;
    if (t > e.b + .35) continue;
    const p = textPos(e.slot);
    const an = textAnim(t, e.a, e.b);
    const style = `right:${p.right}px;top:${p.top}px;width:${p.width}px;`;
    if (e.tag) { html += `<div class="t tag" style="${style}text-align:right;opacity:${an.o};transform:translateY(${an.y}px)">${e.tag}</div>`; continue; }
    const lines = (V && e.vlines) ? e.vlines : e.lines;
    if (e.scrim) html += `<div class="scrim" style="right:${p.right - 200}px;top:${p.top - 160}px;width:${p.width + 400}px;height:${lines.length * 90 + 320}px;opacity:${an.o}"></div>`;
    const size = e.slot === 'ui' ? (V ? 76 : 60) : (V ? 76 : 64);
    html += `<div class="t headline" style="${style}font-size:${size}px;${e.ink ? 'color:' + e.ink : ''}">` + lines.map((l, i) => { const la = textAnim(t, e.a + i * .12, e.b); return `<span class="line" style="opacity:${la.o};transform:translateY(${la.y}px)">${l}</span>`; }).join('');
    if (e.sub) { const sa = textAnim(t, e.subA, e.b); html += `<span class="t sub" style="position:static;display:block;margin-top:20px;opacity:${sa.o};transform:translateY(${sa.y}px)">${e.sub}</span>`; }
    html += `</div>`;
  }
  texts.innerHTML = html;
}

let frameNo = 0;
window.renderFrame = function (t) {
  const seg = cut.segs.find(s => t >= s[1] && t < s[2]) || cut.segs[cut.segs.length - 1];
  const shot = drawShot(pic, seg, t);
  pic.style.opacity = 1;
  // dissolve
  pic2.innerHTML = ''; pic2.style.opacity = 0;
  for (const [a, b, from, to] of cut.dissolves) {
    if (t >= a && t < b && seg[0] === from) {
      const toSeg = cut.segs.find(s => s[0] === to);
      drawShot(pic2, toSeg, toSeg[1] + (t - b) * 0 ); // hold the first frame of the incoming shot
      pic2.style.opacity = easeInOut(prog(t, a, b));
    }
  }
  renderTexts(t);
  const isPrevis = shot.kind === 'svg';
  drawGrain(frameNo++, isPrevis ? .10 : .05);
  document.getElementById('vignette').style.opacity = isPrevis ? 1 : .5;
  if (CHIP && isPrevis) {
    chip.style.display = 'block';
    chip.textContent = 'PREVIS · ' + (seg[5] || shot.label);
    chip.style.left = (V ? 40 : 40) + 'px'; chip.style.bottom = (V ? 60 : 36) + 'px';
  } else chip.style.display = 'none';
};
