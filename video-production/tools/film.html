<!doctype html>
<!--
  "מרעש לבהירות" (From noise to clarity) — 30 s motion-design film for מנהל הכנסות מבית Sydney.
  Deterministic and time-driven: window.renderFrame(t) draws output time t for the chosen cut.
  Query: ?fmt=16x9|9x16  &cut=main|15|06  &still=<t>
  Every element is final: kinetic Hebrew typography, UI rebuilt from the product's own
  strings and tokens, brand lockup and end card. No placeholders, no AI footage.
-->
<html lang="he">
<head>
<meta charset="utf-8" />
<title>Sydney Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=block" rel="stylesheet" />
<style>
  :root { --mint: #41d7b2; --mint-2: #7ccdb5; --deep: #0b2a22; --deeper: #071a15; --ink: #050c0a; --brand-50: #eff8f5; --brand-100: #d7efe7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  body { font-family: "IBM Plex Sans Hebrew", "IBM Plex Sans", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; overflow: hidden; background: var(--ink); }
  .abs { position: absolute; }
  .fill { position: absolute; inset: 0; }
  bdi { unicode-bidi: isolate; }
  .num { font-family: "IBM Plex Sans", sans-serif; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* kinetic type */
  .hl { position: absolute; direction: rtl; font-weight: 700; text-shadow: 0 4px 40px rgba(0,0,0,.55); line-height: 1.08; letter-spacing: -0.01em; }
  .hl .m { display: block; overflow: hidden; padding: 0.04em 0.02em 0.14em; margin-bottom: -0.1em; }
  .hl .m > span { display: inline-block; will-change: transform; }
  .accent { color: var(--mint); }

  /* chaos */
  .amt { position: absolute; font-family: "IBM Plex Sans", sans-serif; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; direction: ltr; transform-origin: 50% 50%; }
  .amt small { display: block; font-size: 0.2em; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; opacity: .55; margin-top: .25em; text-align: center; }
  .q { position: absolute; direction: rtl; font-weight: 600; white-space: nowrap; color: #e9eeec; }
  .rcpt { position: absolute; background: #eeebe4; border-radius: 3px; box-shadow: 0 20px 40px rgba(0,0,0,.45); }
  .rcpt i { position: absolute; left: 12%; height: 5px; border-radius: 3px; background: #c9c6be; }

  /* panels (product dark theme) */
  .panel { position: absolute; direction: rtl; border-radius: 22px; background: linear-gradient(180deg, rgba(14,52,43,.92), rgba(8,32,26,.94)); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 60px 120px -40px rgba(0,0,0,.75), 0 0 0 1px rgba(65,215,178,.04), inset 0 1px 0 rgba(255,255,255,.06); overflow: hidden; transform-style: preserve-3d; }
  .sheen { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.07) 48%, transparent 60%); }
  .ph { display: flex; align-items: center; justify-content: space-between; padding: 26px 32px 20px; border-bottom: 1px solid rgba(255,255,255,.07); }
  .ph h3 { font-size: 29px; font-weight: 600; }
  .ph .muted { color: rgba(255,255,255,.5); font-size: 19px; font-weight: 400; margin-inline-start: 12px; }
  .pill { font-size: 16px; color: rgba(255,255,255,.62); border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 5px 13px; white-space: nowrap; }
  .row { position: absolute; inset-inline: 0; height: 92px; display: flex; align-items: center; gap: 16px; padding: 0 32px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .row .who { flex: 1; min-width: 0; }
  .row .who b { display: block; font-size: 24px; font-weight: 500; }
  .row .who span { display: block; font-size: 17px; color: rgba(255,255,255,.5); margin-top: 1px; }
  .badge { font-size: 15px; font-weight: 500; border-radius: 8px; padding: 5px 10px; white-space: nowrap; }
  .b-ok { background: rgba(47,158,91,.18); color: #7ddc9f; }
  .b-wait { background: rgba(242,181,68,.14); color: #f2c66a; }
  .b-doc { background: rgba(65,215,178,.12); color: #7fe3c9; }
  .b-src { background: rgba(255,255,255,.08); color: rgba(255,255,255,.8); font-family: "IBM Plex Sans", sans-serif; }
  .b-src.live { background: rgba(65,215,178,.2); color: #b6f3e2; }
  .amount { font-size: 26px; font-weight: 500; min-width: 140px; text-align: left; }
  .glow { position: absolute; inset: 5px 8px; border-radius: 12px; border: 1px solid var(--mint); background: rgba(65,215,178,.13); box-shadow: 0 0 30px rgba(65,215,178,.25); }
  .dash .lbl { font-size: 21px; color: rgba(255,255,255,.62); }
  .dash .fig { font-size: 92px; font-weight: 500; line-height: 1.05; margin-top: 4px; }
  .dash .note { font-size: 17px; color: rgba(255,255,255,.5); margin-top: 8px; }
  .dash dl > div { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid rgba(255,255,255,.07); font-size: 21px; position: relative; }
  .dash dt { color: rgba(255,255,255,.7); }
  .dash dd { font-weight: 500; }
  .card { position: absolute; inset-inline: 28px; height: 124px; border-radius: 14px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 18px; padding: 0 22px; }
  .card .who { flex: 1; }
  .card .who b { display: block; font-size: 23px; font-weight: 500; margin-top: 8px; }
  .btn { font-size: 18px; font-weight: 600; border-radius: 10px; padding: 11px 17px; border: 1px solid rgba(255,255,255,.2); white-space: nowrap; }
  .btn.primary { background: var(--mint); color: #062b23; border-color: transparent; }
  .done { position: absolute; inset: 0; border-radius: 14px; background: rgba(8,36,31,.95); border: 1px solid var(--mint); display: flex; align-items: center; justify-content: center; color: var(--mint); font-size: 25px; font-weight: 600; }
  .bub { position: absolute; max-width: 78%; padding: 16px 22px; border-radius: 20px; font-size: 25px; line-height: 1.45; }
  .bub.me { inset-inline-start: 30px; background: rgba(65,215,178,.16); border: 1px solid rgba(65,215,178,.35); border-start-start-radius: 6px; }
  .bub.ai { inset-inline-end: 30px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-start-end-radius: 6px; }
  .input { position: absolute; inset-inline: 28px; bottom: 26px; height: 62px; border-radius: 14px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.2); display: flex; align-items: center; padding: 0 20px; font-size: 22px; color: rgba(255,255,255,.4); }

  .lockup { display: inline-flex; align-items: center; gap: calc(var(--lk) * .45); direction: rtl; }
  .lockup .tile { width: calc(var(--lk) * 2.2); height: calc(var(--lk) * 2.2); border-radius: calc(var(--lk) * .55); background: var(--brand-50); box-shadow: inset 0 0 0 1px var(--brand-100); display: grid; place-items: center; }
  .lockup .tile img { width: 64%; height: 64%; }
  .lockup .name { display: flex; flex-direction: column; align-items: flex-start; font-weight: 600; font-size: var(--lk); line-height: 1.15; }
  .lockup .name small { font-family: "IBM Plex Sans", sans-serif; font-weight: 500; font-size: calc(var(--lk) * .4); letter-spacing: .16em; color: rgba(255,255,255,.62); margin-top: calc(var(--lk) * .15); }
  .cta { display: inline-flex; align-items: center; gap: 14px; background: var(--mint); color: #062b23; font-weight: 600; border-radius: 14px; direction: rtl; box-shadow: 0 0 60px rgba(65,215,178,.35); }
  .url { font-family: "IBM Plex Sans", sans-serif; font-weight: 500; color: rgba(255,255,255,.82); direction: ltr; unicode-bidi: isolate; text-align: center; }
  #grain { position: absolute; inset: -64px; pointer-events: none; mix-blend-mode: overlay; opacity: .06; }
</style>
</head>
<body>
<div id="stage"><div id="world" class="fill"></div><canvas id="grain"></canvas></div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const V = Q.get('fmt') === '9x16';
const CUT = Q.get('cut') || 'main';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
document.getElementById('stage').style.cssText += `width:${W}px;height:${H}px`;

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const expo = x => { x = clamp(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const inQuart = x => Math.pow(clamp(x), 4);
const inOut = x => { x = clamp(x); return x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2; };
const back = x => { x = clamp(x); const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const money = v => '₪' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const moneyShort = v => '₪' + v.toLocaleString('en-US');
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const logo = '../assets/source/investment-logo.svg';

/* ---------- layout per format ---------- */
const L = V ? {
  panel: { l: 50, t: 740, w: 980 }, Z: 1.12, hlRight: 70, hlTop: 300, hlSize: 96, hlWidth: 940,
  heroSize: 150, qSize: 118, spread: [0.40, 0.36],
} : {
  panel: { l: 70, t: 150, w: 1060 }, Z: 1.16, hlRight: 110, hlTop: 340, hlSize: 84, hlWidth: 680,
  heroSize: 190, qSize: 150, spread: [0.42, 0.38],
};

/* ---------- kinetic headline with mask reveal ---------- */
function headline(t, lines, a, b, o = {}) {
  if (t < a - .01 || (b != null && t > b + .35)) return '';
  const size = o.size || L.hlSize;
  const style = o.center ? `left:0;right:0;text-align:center;top:${o.top}px`
    : `right:${o.right ?? L.hlRight}px;top:${o.top ?? L.hlTop}px;width:${o.width ?? L.hlWidth}px;text-align:right`;
  let h = `<div class="hl" style="${style};font-size:${size}px;${o.color ? 'color:' + o.color : ''}">`;
  lines.forEach((ln, i) => {
    const ia = a + i * (o.stagger ?? .08);
    const pin = expo(prog(t, ia, ia + .55));
    const pout = b != null ? inQuart(prog(t, b + i * .04, b + .28 + i * .04)) : 0;
    const y = (1 - pin) * 105 - pout * 105;
    h += `<span class="m"><span style="transform:translateY(${y}%)">${ln}</span></span>`;
  });
  return h + '</div>';
}

function lockup(lk) { return `<div class="lockup" style="--lk:${lk}px"><span class="tile"><img src="${logo}" alt=""></span><span class="name">מנהל הכנסות<small>מבית SYDNEY</small></span></div>`; }

/* ---------- background ---------- */
function background(t) {
  const clar = expo(prog(t, 8.0, 8.6));
  const chaos = prog(t, 4.0, 7.75) * (1 - clar);
  const bx = 70 + Math.sin(t * .35) * 8, by = 18 + Math.cos(t * .3) * 6;
  let s = `<div class="fill" style="background:radial-gradient(120% 95% at ${bx}% ${by}%, rgba(20,70,58,${.25 + .75 * clar}) 0%, rgba(11,42,34,${.3 + .7 * clar}) 45%, #050c0a 100%)"></div>`;
  s += `<div class="fill" style="background:radial-gradient(60% 50% at ${30 + Math.sin(t * .5) * 10}% ${75 + Math.cos(t * .4) * 8}%, rgba(65,215,178,${.10 * clar}), transparent 70%)"></div>`;
  if (chaos > 0) s += `<div class="fill" style="background:radial-gradient(80% 70% at 50% 50%, rgba(160,170,168,${.10 * chaos}), transparent 70%)"></div>`;
  const wave = clar * (t < 25 ? .16 : .24);
  if (wave > 0) s += `<div class="fill" style="background:url('../assets/source/sydney-hero-clean.png') left center / cover no-repeat;opacity:${wave};filter:blur(5px);transform:translate(${-t * 5}px,0) scale(1.06)"></div>`;
  return s;
}

/* ---------- ACT A + B: the noise ---------- */
const AMTS = (() => {
  const r = rng(12), list = [];
  const fixed = [
    [180, 'Cardcom', 0.0, 0, 0, 1.0], [65, 'Grow', 0.5, -.62, -.52, .62], [650, 'Grow', 1.0, .6, .5, .7], [320, 'Cardcom', 1.5, -.58, .55, .6],
  ];
  fixed.forEach(([v, src, at, x, y, s]) => list.push({ v, src, at, x, y, s, fly: true }));
  const vals = [95, 240, 1200, 45, 410, 70, 180, 65, 150, 890, 55, 240, 130, 75, 460, 99, 320, 60, 210, 85, 1450, 40];
  const srcs = ['Grow', 'Cardcom', 'CSV', 'Grow', 'Cardcom'];
  vals.forEach((v, i) => {
    const at = i < 8 ? 2.0 + i * .25 : 4.0 + (i - 8) * .25;
    let x, y; do { x = r() * 2 - 1; y = r() * 2 - 1; } while (Math.abs(x) < .3 && Math.abs(y) < .3);
    list.push({ v, src: srcs[i % 5], at, x: x * .95, y: y * .92, s: .28 + r() * .3, rot: (r() - .5) * 16 });
  });
  return list;
})();
const QS = [
  ['כמה עמלות?', 4.0, .52, -.62], ['איפה הקבלה?', 4.5, -.5, -.22], ['מה עם המע״מ?', 5.0, .42, .5], ['ומה עם ההחזרים?', 5.5, -.44, .66],
];
const RCPTS = (() => { const r = rng(5); return Array.from({ length: 9 }, (_, i) => ({ at: 4.25 + i * .37, x: r() * 2 - 1, y: r() * 2 - 1, rot: (r() - .5) * 70, s: .6 + r() * .6, dx: (r() - .5) * 2, dy: (r() - .5) * 2 })); })();

function sx(x) { return W / 2 + x * W * L.spread[0]; }
function sy(y) { return H / 2 + y * H * L.spread[1]; }
function rowSlot(i) { const Z = L.Z; return { x: L.panel.l + (32 + (V ? 48 : 36)) * Z, y: L.panel.t + (82 + (V ? 0 : 4) + i * 92 + 46) * Z }; }

function noise(t) {
  const T = Math.min(t, 7.75);
  const chaos = prog(T, 4.0, 7.75);
  const sweep = prog(t, 8.0, 8.35);
  const lineX = W + 60 - sweep * (W + 120);
  const blow = expo(prog(t, 8.0, 8.5));
  let s = '', flyers = '';
  AMTS.forEach((a, i) => {
    if (T < a.at) return;
    const age = T - a.at;
    const pin = expo(prog(T, a.at, a.at + .22));
    const recede = a.fly ? clamp(age * .22, 0, .55) : clamp(age * .3, 0, .7);
    const dim = t >= 2.0 && t < 4.0 ? 1 - .75 * prog(t, 2.0, 2.3) * (1 - prog(t, 3.72, 4.0)) : (T > 6.0 ? 1 - .55 * prog(T, 6.0, 6.4) : 1);
    let sc = (V ? .75 : 1) * a.s * (1.35 - .35 * pin) * (1 - recede * .6);
    const jitter = chaos * 5;
    let x = sx(a.x) + Math.sin(T * 13 + i * 2.1) * jitter + (a.rot || 0) * chaos * 3;
    let y = sy(a.y) + Math.cos(T * 11 + i) * jitter;
    let rot = (a.rot || 0) * chaos + Math.sin(T * 3 + i) * chaos * 4;
    let blur = recede * 7 * (1 - pin * .2) + chaos * 1.5;
    let op = pin * (1 - recede * .6) * dim;
    const grey = chaos;
    const col = `rgb(${lerp(244, 196, grey)},${lerp(247, 204, grey)},${lerp(245, 201, grey)})`;
    const size = L.heroSize;
    if (t >= 8.0) {
      if (a.fly) {
        const slot = rowSlot(i), f = expo(prog(t, 8.0, 8.45));
        x = lerp(x, slot.x, f); y = lerp(y, slot.y, f);
        sc = lerp(sc, 26 * L.Z / size, f); rot = lerp(rot, 0, f); blur = lerp(blur, 0, f) + (1 - f) * 2;
        op = lerp(op, 1, f) * (1 - prog(t, 8.48, 8.62));
        flyers += `<div class="amt" style="left:${x}px;top:${y}px;font-size:${size}px;color:${f > .5 ? '#fff' : col};transform:translate(-50%,-50%) scale(${sc}) rotate(${rot}deg);filter:blur(${blur}px);opacity:${op}">${f > .5 ? money(a.v) : moneyShort(a.v)}</div>`;
        return;
      }
      const dx = (x - W / 2), dy = (y - H / 2);
      x += dx * blow * .8; y += dy * blow * .8; sc *= 1 + blow * .6; op *= 1 - blow; blur += blow * 18;
      if (op <= .01) return;
    }
    s += `<div class="amt" style="left:${x}px;top:${y}px;font-size:${size}px;color:${col};transform:translate(-50%,-50%) scale(${sc}) rotate(${rot}deg);filter:blur(${blur}px);opacity:${op}">${moneyShort(a.v)}<small>${a.src}</small></div>`;
  });
  RCPTS.forEach((r, i) => {
    if (T < r.at) return;
    const age = T - r.at, pin = expo(prog(T, r.at, r.at + .35));
    let x = sx(r.x * .9) + r.dx * age * 40, y = sy(r.y * .85) + r.dy * age * 30 + (1 - pin) * 200;
    const behind = T > 6.0 ? 1 - .7 * prog(T, 6.0, 6.4) : 1;
    let op = pin * .85 * behind * (1 - blow), sc = r.s * (V ? .8 : 1) * (1 + blow * .5), blur = 1 + age * 1.2 + (1 - behind) * 8 + blow * 16;
    x += (x - W / 2) * blow * .8; y += (y - H / 2) * blow * .8;
    if (op <= .01) return;
    const lines = Array.from({ length: 7 }, (_, k) => `<i style="top:${16 + k * 12}%;width:${60 - (k % 3) * 14}%"></i>`).join('');
    s += `<div class="rcpt" style="left:${x}px;top:${y}px;width:120px;height:300px;transform:translate(-50%,-50%) rotate(${r.rot + age * 8}deg) scale(${sc});opacity:${op};filter:blur(${blur}px)">${lines}</div>`;
  });
  QS.forEach(([q, at, x, y], i) => {
    if (T < at) return;
    const pin = expo(prog(T, at, at + .35));
    const recede = clamp((T - 6.0) * .5, 0, .6);
    let px = sx(x) + Math.sin(T * 12 + i) * chaos * 4, py = sy(y);
    let op = (1 - recede * .8) * (1 - blow), blur = recede * 8 + blow * 16, sc = (1 + blow * .5);
    px += (px - W / 2) * blow * .8; py += (py - H / 2) * blow * .8;
    const sz = V ? 56 : 58;
    s += `<div class="q" style="left:${px}px;top:${py}px;font-size:${sz}px;transform:translate(-50%,-50%) scale(${sc});opacity:${op};filter:blur(${blur}px)"><span style="display:inline-block;overflow:hidden;padding-bottom:.12em"><span style="display:inline-block;transform:translateY(${(1 - pin) * 110}%)">${q}</span></span></div>`;
  });
  if (T >= 6.0) {
    const shake = chaos * 3;
    const h = headline(T, V ? ['כמה באמת', 'נכנס?'] : ['כמה באמת נכנס?'], 6.0, null, { center: true, top: V ? 800 : 440, size: L.qSize, stagger: .1 });
    s += `<div class="fill" style="transform:translate(${Math.sin(T * 40) * shake}px,${Math.cos(T * 37) * shake}px) scale(${1 + blow * .4});opacity:${1 - blow};filter:blur(${blow * 14}px)">${h}</div>`;
  }
  s += headline(t, V ? ['מכירות,', 'הכנסות'] : ['מכירות, הכנסות'], 2.0, 3.72, { center: true, top: V ? 745 : 420, size: V ? 150 : 180 });
  let out = `<div class="fill" style="clip-path:inset(0 ${Math.max(0, W - lineX)}px 0 0)">${s}</div>`;
  if (t >= 8.0 && t < 8.5) {
    out += `<div class="abs" style="left:${lineX}px;top:0;width:260px;height:${H}px;background:linear-gradient(90deg, rgba(65,215,178,.55), rgba(65,215,178,.12) 30%, transparent);opacity:${1 - prog(t, 8.3, 8.45)}"></div>`;
    out += `<div class="abs" style="left:${lineX - 3}px;top:0;width:6px;height:${H}px;background:var(--mint);box-shadow:0 0 40px 10px rgba(65,215,178,.6), 0 0 120px 40px rgba(65,215,178,.25);opacity:${1 - prog(t, 8.3, 8.45)}"></div>`;
  }
  return { html: out, flyers, lineX };
}

/* ---------- product panels ---------- */
const ROWS = [
  { who: 'שיעור פרטי', sub: 'היום · 16:12', src: 'Cardcom', doc: ['b-wait', 'ממתין למסמך מהספק'], amt: 180 },
  { who: 'שיעור קבוצתי', sub: 'היום · 15:00', src: 'Grow', doc: ['b-doc', 'מסמך הופק'], amt: 65 },
  { who: 'כרטיסייה 10 שיעורים', sub: 'היום · 11:05', src: 'Grow', doc: ['b-doc', 'מסמך הופק'], amt: 650 },
  { who: 'אימון זוגי', sub: 'היום · 09:30', src: 'Cardcom', doc: ['b-doc', 'מסמך הופק'], amt: 320 },
];
const NEW_ROWS = [
  { at: 10.5, who: 'שיעור ניסיון', sub: 'היום · 17:40', src: 'Grow', doc: ['b-doc', 'מסמך הופק'], amt: 95 },
  { at: 11.5, who: 'אימון אישי', sub: 'היום · 18:15', src: 'Cardcom', doc: ['b-wait', 'ממתין למסמך מהספק'], amt: 240 },
  { at: 12.5, who: 'שיעור פרטי', sub: 'היום · 19:02', src: 'Cardcom', doc: ['b-wait', 'ממתין למסמך מהספק'], amt: 180 },
];
function rowHTML(r, y, op = 1, tx = 0, glow = 0, live = false, amtOp = 1) {
  return `<div class="row" style="top:${y}px;opacity:${op};transform:translateX(${tx}px)">
    ${glow > 0 ? `<div class="glow" style="opacity:${glow}"></div>` : ''}
    <div class="who"><b>${r.who}</b><span>${r.sub.replace(/(\d\d:\d\d)/, '<bdi class="num">$1</bdi>')}</span></div>
    <span class="badge b-src${live ? ' live' : ''}">${r.src}</span>
    <span class="badge b-ok">הצליחה</span>
    ${V ? '' : `<span class="badge ${r.doc[0]}">${r.doc[1]}</span>`}
    <span class="amount num" style="opacity:${amtOp}"><bdi>${money(r.amt)}</bdi></span></div>`;
}
function salesPanel(t) {
  const rowH = 92, n = 5;
  const landed = NEW_ROWS.filter(r => t >= r.at);
  const last = landed[landed.length - 1];
  const rows = [...landed.slice().reverse().map(r => ({ ...r, isNew: true })), ...ROWS];
  let h = '';
  rows.forEach((r, i) => {
    let y = i * rowH, op = 1, tx = 0, glow = 0;
    const isLast = r.isNew && last && r.at === last.at;
    if (last) {
      const p = expo(prog(t, last.at, last.at + .35));
      if (isLast) { op = p; tx = (1 - p) * -40; y = 0; }
      else y = (i - 1) * rowH + p * rowH;
    }
    if (r.isNew) glow = clamp(1 - prog(t, r.at + .6, r.at + 1.4));
    if (y > n * rowH) return;
    if (y > (n - 1) * rowH) op *= clamp(1 - (y - (n - 1) * rowH) / rowH);
    if (t < 8.6 && !r.isNew) { const k = ROWS.indexOf(r); op *= expo(prog(t, 8.1 + k * .05, 8.45 + k * .05)); }
    h += rowHTML(r, y, op, tx, glow, r.isNew, r.isNew ? 1 : prog(t, 8.48, 8.62));
  });
  return `<div class="ph"><div><h3 style="display:inline">מכירות</h3><span class="muted">היום</span></div><span class="pill">נתונים להמחשה</span></div>
    <div style="position:relative;height:${rowH * n}px">${h}</div>`;
}
function dashPanel(t) {
  const e = expo(prog(t, 14.6, 15.8));
  const v = (a, b) => lerp(a, b, e);
  const rowsD = [['הכנסה ברוטו', v(30440, 30620)], ['מע״מ הכלול בברוטו', v(4643.39, 4670.85)], ['עמלות סליקה', v(639.24, 643.02)], ['החזרים חלקיים', 456.13]];
  const draw = expo(prog(t, 14.3, 15.8));
  const pathD = 'M0 96 C40 92 60 70 95 76 S150 98 190 72 S245 80 285 58 S340 66 380 44 S430 54 470 34 S540 40 600 22';
  const cw = L.panel.w / L.Z - 72;
  const glowFig = t > 14.6 && t < 16.2 ? `text-shadow:0 0 ${40 * (1 - prog(t, 15.4, 16.2))}px rgba(65,215,178,.55)` : '';
  return `<div class="dash" style="padding:28px 36px 22px">
    <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:27px;font-weight:600">סיכום התקופה</h3><span class="pill">נתונים להמחשה · ספטמבר</span></div>
    <div class="lbl" style="margin-top:20px">תקבולים נטו לאחר ניכויים</div>
    <div class="fig num" style="${glowFig}"><bdi>${money(v(24701.24, 24850.00))}</bdi></div>
    <div class="note">ברוטו בניכוי מע״מ, עמלות והחזרים. אינו רווח ואינו יתרת חשבון.</div>
    <svg viewBox="0 0 600 120" preserveAspectRatio="none" style="width:${cw}px;height:${V ? 140 : 118}px;margin:14px 0 6px;display:block;direction:ltr;overflow:visible">
      <defs><linearGradient id="pf" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#47b395" stop-opacity=".38"/><stop offset="1" stop-color="#47b395" stop-opacity="0"/></linearGradient>
      <clipPath id="pc"><rect x="0" y="-10" width="${600 * draw}" height="140"/></clipPath></defs>
      <g clip-path="url(#pc)"><path d="${pathD} L600 120 L0 120Z" fill="url(#pf)"/><path d="${pathD}" stroke="#7ccdb5" stroke-width="2.5" fill="none" vector-effect="non-scaling-stroke"/></g>
      ${draw > .98 ? `<circle cx="600" cy="22" r="5" fill="#41d7b2"/><circle cx="600" cy="22" r="${5 + 10 * prog(t, 15.8, 16.6)}" fill="none" stroke="#41d7b2" stroke-opacity="${1 - prog(t, 15.8, 16.6)}"/>` : ''}
    </svg>
    <dl>${rowsD.map(([l, val], k) => { const p = expo(prog(t, 14.3 + k * .125, 14.75 + k * .125)); const g = k < 3 && t > 14.6 ? clamp(1 - prog(t, 15.0 + k * .2, 15.8 + k * .2)) : 0; return `<div style="opacity:${p};transform:translateX(${(1 - p) * -30}px)">${g > 0 ? `<span class="glow" style="inset:3px -12px;opacity:${g}"></span>` : ''}<dt>${l}</dt><dd class="num"><bdi>${money(val)}</bdi></dd></div>`; }).join('')}</dl></div>`;
}
function attentionPanel(t) {
  const click = t >= 19.5 && t < 19.6, done = t >= 19.55;
  const out = expo(prog(t, 19.8, 20.2)), up = expo(prog(t, 20.0, 20.35)), cnt = expo(prog(t, 20.0, 20.4));
  return `<div style="padding:28px 36px 0">
      <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:27px;font-weight:600">דורש טיפול</h3><span class="pill">נתונים להמחשה</span></div>
      <div style="display:flex;align-items:baseline;gap:16px;margin-top:12px">
        <strong class="num" style="font-size:88px;font-weight:500;line-height:1;position:relative;display:inline-block;width:60px;height:92px;overflow:hidden">
          <span style="position:absolute;inset-inline-start:0;top:0;transform:translateY(${-cnt * 100}%)">2</span><span style="position:absolute;inset-inline-start:0;top:0;transform:translateY(${100 - cnt * 100}%);color:var(--mint)">1</span></strong>
        <em style="font-style:normal;font-size:22px;color:rgba(255,255,255,.62)">מכירות שדורשות פעולה</em></div></div>
    <div style="position:relative;height:300px;margin-top:18px">
      <div class="card" style="top:0;transform:translateX(${out * 160}px);opacity:${1 - out}">
        <div class="who"><span class="badge b-wait">מסמך ממתין</span><b>אימון זוגי · <span class="num"><bdi>21.9</bdi></span></b></div>
        <span class="amount num"><bdi>${money(320)}</bdi></span>
        <span class="btn primary" style="transform:scale(${click ? .93 : 1})">ייבוא מסמך</span>
        ${done ? `<div class="done">✓ טופל</div>` : ''}</div>
      <div class="card" style="top:${142 * (1 - up)}px">
        <div class="who"><span class="badge" style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.78)">בדיקת מע״מ</span><b>כרטיסייה 10 שיעורים · <span class="num"><bdi>3.9</bdi></span></b></div>
        <span class="amount num"><bdi>${money(650)}</bdi></span><span class="btn">פרטי מכירה</span></div>
    </div>`;
}
function assistantPanel(t) {
  const q = 'כמה הכנסתי החודש?';
  const typed = Math.floor(q.length * prog(t, 22.35, 23.05));
  const sent = t >= 23.15;
  const sp = expo(prog(t, 23.15, 23.45));
  const dots = t >= 23.35 && t < 23.8;
  const ans = expo(prog(t, 23.8, 24.2));
  const caret = `<span style="display:inline-block;width:2px;height:28px;background:var(--mint);margin-inline-start:3px;vertical-align:middle;opacity:${Math.floor(t * 4) % 2 ? 1 : .2}"></span>`;
  const inputTxt = sent || typed === 0 ? 'שאל שאלה...' : `<span style="color:#fff">${q.slice(0, typed)}</span>${caret}`;
  return `<div class="ph"><div><h3 style="display:inline">עוזר AI</h3><span class="muted">${V ? '' : 'שאל שאלות על המכירות וההכנסות שלך'}</span></div><span class="pill">נתונים להמחשה</span></div>
    <div style="position:relative;height:${V ? 470 : 430}px">
      ${sent ? `<div class="bub me" style="top:${lerp(330, 30, sp)}px;opacity:${sp}">${q}</div>` : ''}
      ${dots ? `<div class="bub ai" style="top:130px;letter-spacing:.2em">${['•', '• •', '• • •'][Math.floor(t * 8) % 3]}</div>` : ''}
      ${t >= 23.8 ? `<div class="bub ai" style="top:130px;opacity:${ans};transform:translateY(${(1 - ans) * 16}px)">בספטמבר נכנסו <b class="num" style="color:var(--mint);font-weight:600"><bdi>${money(24850)}</bdi></b> נטו, לאחר מע״מ, עמלות סליקה והחזרים.</div>` : ''}
      <div class="input">${inputTxt}</div></div>`;
}

/* ---------- panel choreography (whip pans between features) ---------- */
const SCENES = [
  { id: 'sales', a: 8.0, b: 14.0, draw: salesPanel },
  { id: 'dash', a: 14.0, b: 18.0, draw: dashPanel },
  { id: 'att', a: 18.0, b: 22.0, draw: attentionPanel },
  { id: 'ai', a: 22.0, b: 25.0, draw: assistantPanel },
];
const SLOTS = V ? { sales: [.30, .27, .5], dash: [.72, .40, .5], att: [.28, .60, .5], ai: [.70, .74, .5] }
                : { sales: [.25, .30, .42], dash: [.74, .28, .42], att: [.28, .74, .42], ai: [.72, .72, .42] };
function panels(t, lineX) {
  let s = '';
  const P = L.panel;
  SCENES.forEach((sc, idx) => {
    let x = 0, blur = 0, op = 1, rotY = V ? 0 : 7, scale = 1, ty = 0;
    if (t < sc.a - (idx === 0 ? 0 : .15)) return;
    if (idx > 0) { const p = expo(prog(t, sc.a - .15, sc.a + .35)); x = (1 - p) * -W * .75; blur += (1 - p) * 24; }
    const life = prog(t, sc.a, sc.b);
    scale *= 1 + .05 * life; rotY -= 4 * life;
    if (t >= 25.0) {
      const [fx, fy, fs] = SLOTS[sc.id];
      const p = expo(prog(t, 25.0 + idx * .07, 25.7 + idx * .07));
      const tx = fx * W - (P.l + P.w / 2), tyy = fy * H - (P.t + 260);
      const from = sc.id === 'ai' ? 0 : (idx % 2 ? W * .8 : -W * .8);
      x = lerp(from, tx, p); scale = lerp(sc.id === 'ai' ? 1.05 : .6, fs, p); rotY = lerp(3, idx % 2 ? -10 : 10, p);
      ty = lerp(0, tyy, p) + Math.sin(t * 1.3 + idx) * 6;
      const fade = prog(t, 25.9, 26.6); op = (sc.id === 'ai' ? 1 : p) * (1 - fade * .7); blur = (1 - p) * 20 + fade * 9;
    } else if (t > sc.b - .15) {
      if (sc.id === 'ai') { /* stays for the finale */ }
      else { if (t > sc.b + .15) return; const p = inQuart(prog(t, sc.b - .15, sc.b + .15)); x += p * W * .75; blur += p * 24; op *= 1 - p * .3; }
    }
    let clip = '';
    if (idx === 0 && t < 8.4) clip = `clip-path:inset(0 0 0 ${Math.max(0, lineX - P.l)}px);`;
    const pulse = t > 8.0 && t < 25 ? 1 + .008 * Math.exp(-((t - 8.0) % .5) / .07) : 1;
    const sheen = ((t * .35 + idx * .3) % 1.8) - .4;
    s += `<div class="panel" style="left:${P.l}px;top:${P.t}px;width:${P.w}px;${clip}transform:perspective(1800px) translate(${x}px,${ty}px) rotateY(${rotY}deg) rotateX(${V ? 0 : 3}deg) scale(${scale * pulse});filter:blur(${blur}px);opacity:${op}">
      <div style="zoom:${L.Z};width:${P.w / L.Z}px">${sc.draw(Math.min(t, sc.b + .15))}</div><div class="sheen" style="transform:translateX(${sheen * 100}%)"></div></div>`;
  });
  return s;
}

/* ---------- cursor ---------- */
function cursor(t) {
  if (t < 18.5 || t > 20.1) return '';
  const P = L.panel;
  const bx = P.l + (V ? 120 : 130) * L.Z, by = P.t + 250 * L.Z;
  const p = inOut(prog(t, 18.6, 19.35));
  const x = lerp(P.l + P.w * .5, bx, p), y = lerp(P.t + 520, by, p) - Math.sin(p * Math.PI) * 50;
  return `<svg class="abs" style="left:${x}px;top:${y}px;width:34px;height:50px;opacity:${1 - prog(t, 19.8, 20.1)}" viewBox="0 0 30 44"><path d="M2 2 L2 34 L10 26 L16 40 L22 37 L16 24 L27 24 Z" fill="#fff" stroke="#0b0f0e" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}

/* ---------- feature headlines ---------- */
function sub(t, text, a, b, dy) {
  if (t < a || t > b + .3) return '';
  const p = expo(prog(t, a, a + .4)), o = 1 - inQuart(prog(t, b, b + .25));
  return `<div class="abs" style="right:${L.hlRight}px;top:${L.hlTop + dy}px;width:${L.hlWidth}px;text-align:right;direction:rtl;opacity:${p * o};transform:translateY(${(1 - p) * 18}px)">${text}</div>`;
}
function featureType(t) {
  let s = '';
  s += headline(t, ['מנהל הכנסות', '<span class="accent">לעסקים</span>'], 8.3, 9.85);
  s += sub(t, lockup(V ? 34 : 30), 9.1, 9.85, V ? 250 : 240);
  s += headline(t, ['מכירה חדשה.', 'עדכון אוטומטי.'], 10.1, 13.7);
  s += sub(t, `<span style="font-size:${V ? 34 : 30}px;color:rgba(255,255,255,.72)">חיבור ישיר ל-Grow ול-Cardcom</span>`, 10.6, 13.7, V ? 250 : 230);
  s += headline(t, ['התמונה המלאה,', 'במבט אחד.'], 14.3, 17.7);
  s += headline(t, ['יודעים מה', 'דורש טיפול.'], 18.3, 21.7);
  s += headline(t, ['שואלים את', 'הנתונים שלכם.'], 22.3, 24.75);
  return s;
}

/* ---------- end card ---------- */
function endCard(t) {
  if (t < 25.9) return '';
  const top = V ? 640 : 270;
  const rise = expo(prog(t, 27.1, 27.7)) * (V ? 70 : 60);
  let s = `<div class="fill" style="background:radial-gradient(70% 60% at 50% 45%, rgba(5,12,10,${.6 * prog(t, 25.9, 26.5)}), transparent 85%)"></div>`;
  s += `<div class="fill" style="transform:translateY(${-rise}px)">${headline(t, ['מכירות, הכנסות', 'ומה שדורש טיפול.', '<span class="accent">במקום אחד.</span>'], 26.0, null, { center: true, top, size: V ? 100 : 96, stagger: .3 })}</div>`;
  const lk = expo(prog(t, 27.25, 27.75)), ct = expo(prog(t, 27.5, 28.0)), ur = expo(prog(t, 27.62, 28.1));
  const ly = V ? 1000 : 610, cy = V ? 1170 : 750, uy = V ? 1290 : 860;
  s += `<div class="abs" style="left:0;right:0;top:${ly}px;display:flex;justify-content:center;opacity:${lk};transform:translateY(${(1 - lk) * 24}px)">${lockup(V ? 44 : 40)}</div>`;
  s += `<div class="abs" style="left:0;right:0;top:${cy}px;display:flex;justify-content:center;opacity:${ct};transform:translateY(${(1 - ct) * 24}px) scale(${lerp(.92, 1, back(prog(t, 27.5, 28.0)))})"><span class="cta" style="font-size:${V ? 38 : 32}px;padding:${V ? '22px 40px' : '18px 34px'}">פתיחת חשבון <span style="font-family:'IBM Plex Sans'">←</span></span></div>`;
  if (CUT !== '06') s += `<div class="url abs" style="left:0;right:0;top:${uy}px;font-size:${V ? 32 : 28}px;opacity:${ur};transform:translateY(${(1 - ur) * 16}px)">sydney-revenue-manager.vercel.app</div>`;
  return s;
}

/* ---------- master draw (source time) ---------- */
function draw(t) {
  let h = background(t);
  const n = t < 8.6 ? noise(t) : { html: '', flyers: '', lineX: -100 };
  h += n.html;
  if (t >= 8.0 && t < 8.5) h += `<div class="fill" style="background:radial-gradient(60% 60% at 50% 50%, rgba(65,215,178,${.28 * (1 - prog(t, 8.0, 8.45))}), transparent 70%)"></div>`;
  if (t >= 8.0) h += panels(t, n.lineX);
  h += n.flyers;
  h += cursor(t);
  h += featureType(t);
  h += endCard(t);
  if (t >= 7.75 && t < 8.0) h += `<div class="fill" style="background:rgba(0,0,0,.35)"></div>`;
  document.getElementById('world').innerHTML = h;
}

/* ---------- cuts (output time -> source time) ---------- */
const CUTS = {
  main: { dur: 30, segs: [[0, 30, 0]] },
  '15': { dur: 15, segs: [[0, 2, 0], [2, 4, 6.0], [4, 6, 8.0], [6, 8, 11.0], [8, 10.5, 14.0], [10.5, 15, 25.5]] },
  '06': { dur: 6, segs: [[0, 2, 0], [2, 3, 8.0], [3, 6, 27.0]] },
};
const cut = CUTS[CUT];
function srcTime(t) { const s = cut.segs.find(g => t >= g[0] && t < g[1]) || cut.segs[cut.segs.length - 1]; return s[2] + (t - s[0]); }

/* ---------- grain ---------- */
const gc = document.getElementById('grain'); gc.width = W + 128; gc.height = H + 128;
const gx = gc.getContext('2d'); const tiles = [];
for (let k = 0; k < 4; k++) { const c = document.createElement('canvas'); c.width = c.height = 256; const cx = c.getContext('2d'); const im = cx.createImageData(256, 256); const r = rng(40 + k); for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - .5) * 120; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } cx.putImageData(im, 0, 0); tiles.push(c); }
let fno = 0;
window.renderFrame = function (t) {
  draw(srcTime(t));
  gx.fillStyle = gx.createPattern(tiles[fno % 4], 'repeat'); gx.fillRect(0, 0, gc.width, gc.height);
  gc.style.transform = `translate(${-(fno * 37) % 64}px,${-(fno * 53) % 64}px)`; fno++;
};
window.__dur = cut.dur;
Promise.all([
  document.fonts.load('700 100px "IBM Plex Sans Hebrew"', 'אב'), document.fonts.load('600 30px "IBM Plex Sans Hebrew"', 'אב'),
  document.fonts.load('500 30px "IBM Plex Sans Hebrew"', 'אב'), document.fonts.load('400 30px "IBM Plex Sans Hebrew"', 'אב'),
  document.fonts.load('600 30px "IBM Plex Sans"', '0'), document.fonts.load('500 30px "IBM Plex Sans"', '0'),
  new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = logo; }),
  new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = '../assets/source/sydney-hero-clean.png'; }),
]).then(() => document.fonts.ready).then(() => {
  const st = Q.get('still'); window.renderFrame(st != null ? parseFloat(st) : 0);
  window.__fontsOK = document.fonts.check('700 100px "IBM Plex Sans Hebrew"', 'א');
  window.__ready = true;
});
</script>
