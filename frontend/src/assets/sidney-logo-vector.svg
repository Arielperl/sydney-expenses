<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sidney robot logo</title>
  <desc id="desc">A blue ribbon in the shape of an S, with a smiling robot face and two blue rays. Transparent background. Reconstructed entirely with vector paths and gradients.</desc>
